# project3 infra: fmt, validate and unit tests on every PR (no AWS needed),
# then "tofu plan" per environment, posted as a PR comment (needs AWS, see below).
#
# The plan job runs only when the repository variables AWS_PLAN_ROLE_ARN and
# TF_STATE_BUCKET are set, and never for PRs from forks (they get no OIDC token).
name: OpenTofu Plan (project3)

on:
  pull_request:
    paths:
      - 'project3-ecs-fargate-deploy/infra/**'
      - '.github/workflows/tofu-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOFU_VERSION: 1.12.2
  WORKDIR: project3-ecs-fargate-deploy/infra

jobs:
  checks:
    name: fmt / validate / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      - name: tofu init (no backend)
        run: tofu init -backend=false -input=false

      - name: tofu validate
        run: tofu validate

      # Plans the stack against a mocked AWS provider (tests/*.tftest.hcl).
      - name: tofu test
        run: tofu test

  plan:
    name: plan (${{ matrix.environment }})
    needs: checks
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for the read-only plan role
      pull-requests: write # post the plan as a comment
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TARGET_ENV: ${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Configure AWS credentials (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-p3-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu init
        run: |
          tofu init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=project3/${TARGET_ENV}.tfstate" \
            -backend-config="region=${AWS_REGION}"

      # -lock=false: a PR plan is read-only and must not block a real apply.
      - name: tofu plan
        id: plan
        run: |
          set +e
          tofu plan -input=false -no-color -lock=false \
            -var-file="environments/${TARGET_ENV}.tfvars" \
            -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            tofu show -no-color tfplan > plan.txt
          else
            cp plan.log plan.txt
          fi
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: Post plan as PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ env.WORKDIR }}/plan.txt
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.TARGET_ENV;
            const marker = `<!-- tofu-plan:project3:${env} -->`;
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const max = 60000; // GitHub comments are limited to 65536 characters
            if (plan.length > max) {
              plan = plan.slice(0, max) + '\n... (truncated, see the job log for the full plan)';
            }
            const ok = process.env.PLAN_EXITCODE === '0';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### OpenTofu plan: \`${env}\` ${ok ? 'succeeded' : 'FAILED'}`,
              `Commit ${context.sha.substring(0, 7)} - [workflow run](${runUrl})`,
              '<details><summary>Show plan</summary>',
              '',
              '```text',
              plan,
              '```',
              '</details>',
            ].join('\n');

            // Update the previous comment for this environment instead of adding a new one.
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: |
          echo "::error::tofu plan failed for ${TARGET_ENV}"
          exit 1
