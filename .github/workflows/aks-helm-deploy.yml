# project3: build -> test -> Trivy scan -> push to ACR -> Helm deploy to AKS.
#   staging    deploys automatically from main
#   production waits for an approval on the "production" GitHub Environment
#
# Safe without Azure: on pull requests, and while the AZURE_CLIENT_ID_STAGING /
# AZURE_CLIENT_ID_PRODUCTION repository variables are empty, only the build, test,
# scan and chart checks run. Azure login uses OIDC, so no secrets are needed.
name: AKS Helm Deploy (project3)

on:
  push:
    branches: [main]
    paths:
      - 'project3-aks-helm-deploy/app/**'
      - 'project3-aks-helm-deploy/chart/**'
      - 'project3-aks-helm-deploy/scripts/**'
      - '.github/workflows/aks-helm-deploy.yml'
  pull_request:
    paths:
      - 'project3-aks-helm-deploy/app/**'
      - 'project3-aks-helm-deploy/chart/**'
      - 'project3-aks-helm-deploy/scripts/**'
      - '.github/workflows/aks-helm-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy half way; queue the next run instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: project3-aks-helm-deploy/app
  CHART_DIR: project3-aks-helm-deploy/chart
  IMAGE_NAME: p3-aks-app
  IMAGE: p3-aks-app:${{ github.sha }}
  # Helm 3: "--atomic" is called "--rollback-on-failure" in Helm 4.
  HELM_VERSION: v3.22.0
  KUBECTL_VERSION: v1.35.0
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.7.0

jobs:
  build-scan:
    name: Build, test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      actions: read # needed by upload-sarif on private repositories
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once. The same image bytes are scanned, pushed and promoted.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP_DIR }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=p3-aks
          cache-to: type=gha,scope=p3-aks,mode=max

      # Report every finding to the Security tab, without failing the job yet.
      - name: Trivy scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      # Fork PRs get a read-only token, so code scanning upload would fail there.
      - name: Upload SARIF to GitHub code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-project3

      # The gate: fail on HIGH or CRITICAL findings that have a fix available.
      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Save image for the deploy job
        if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID_STAGING != ''
        run: docker save "$IMAGE" -o "${{ runner.temp }}/image.tar"

      - name: Upload image artifact
        if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID_STAGING != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p3-aks-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          STAGING_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_STAGING }}
        run: |
          {
            echo "### project3 build"
            echo "- Image: \`$IMAGE\`"
            if [ -z "$STAGING_CLIENT_ID" ]; then
              echo "- Deploy skipped: repository variable \`AZURE_CLIENT_ID_STAGING\` is not set."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Render each environment and validate it against the Kubernetes schemas.
      - name: helm lint + kubeconform
        run: |
          set -euo pipefail
          for env in staging production; do
            echo "::group::$env"
            helm lint "$CHART_DIR" --strict -f "$CHART_DIR/values-$env.yaml" --set image.tag=ci
            helm template "$IMAGE_NAME" "$CHART_DIR" --namespace "$env" \
              -f "$CHART_DIR/values-$env.yaml" --set image.tag=ci \
              | docker run --rm -i "$KUBECONFORM_IMAGE" -strict -summary -
            echo "::endgroup::"
          done

  deploy-staging:
    name: Deploy to staging
    needs: [build-scan, chart]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID_STAGING != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login
    # The federated credential trusts "repo:<owner>/<repo>:environment:staging".
    environment: staging
    env:
      ENVIRONMENT: staging
      ACR_NAME: ${{ vars.ACR_NAME }}
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP || 'rg-p3-aks' }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME || 'aks-p3-aks' }}
      # Optional Environment variable: turns on Workload ID for the app.
      APP_IDENTITY_CLIENT_ID: ${{ vars.APP_IDENTITY_CLIENT_ID }}
    steps:
      - name: Check configuration
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          for v in AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: p3-aks-image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load -i "${{ runner.temp }}/image.tar"

      # Short-lived token from GitHub OIDC. No client secret is stored in GitHub.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_STAGING }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The staging identity has AcrPush only. The tag is the commit SHA, never "latest".
      - name: Push image to ACR
        id: push
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          repository="${ACR_NAME,,}.azurecr.io/${IMAGE_NAME}"
          docker tag "$IMAGE" "${repository}:${GITHUB_SHA}"
          docker push "${repository}:${GITHUB_SHA}"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: v0.2.20

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Local accounts are disabled: the kubeconfig uses Entra ID through kubelogin,
      # reusing the az CLI login. Azure RBAC limits this identity to its namespace.
      - name: Get AKS credentials
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Helm deploy + smoke test
        env:
          IMAGE_REPOSITORY: ${{ steps.push.outputs.repository }}
        run: project3-aks-helm-deploy/scripts/deploy.sh "$ENVIRONMENT" "$IMAGE_REPOSITORY" "$GITHUB_SHA"

      - name: Summary
        if: always()
        env:
          IMAGE_REPOSITORY: ${{ steps.push.outputs.repository }}
        run: |
          {
            echo "### ${ENVIRONMENT}"
            echo "- Image: \`${IMAGE_REPOSITORY}:${GITHUB_SHA}\`"
            echo "- Cluster: \`${AKS_RESOURCE_GROUP}/${AKS_CLUSTER_NAME}\`, namespace \`${ENVIRONMENT}\`"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    if: vars.AZURE_CLIENT_ID_PRODUCTION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Required reviewers on this Environment gate the job. GitHub issues the
    # production OIDC token only after approval.
    environment: production
    env:
      ENVIRONMENT: production
      ACR_NAME: ${{ vars.ACR_NAME }}
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP || 'rg-p3-aks' }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME || 'aks-p3-aks' }}
      APP_IDENTITY_CLIENT_ID: ${{ vars.APP_IDENTITY_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PRODUCTION }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: v0.2.20

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Get AKS credentials
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      # Promote: the exact image that passed staging. No rebuild, no push.
      - name: Helm deploy + smoke test
        run: project3-aks-helm-deploy/scripts/deploy.sh "$ENVIRONMENT" "${ACR_NAME,,}.azurecr.io/${IMAGE_NAME}" "$GITHUB_SHA"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${ENVIRONMENT}"
            echo "- Image: \`${ACR_NAME,,}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- Cluster: \`${AKS_RESOURCE_GROUP}/${AKS_CLUSTER_NAME}\`, namespace \`${ENVIRONMENT}\`"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
