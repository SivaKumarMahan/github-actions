# Reusable workflow: push one image to one environment's ECR repo and roll the ECS service.
# Called by ecs-fargate-deploy.yml once per environment (staging, then production).
name: ECS Fargate Deploy - one environment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name (staging or production). Also the OIDC subject.
        type: string
        required: true
      role-arn:
        description: IAM role to assume with GitHub OIDC.
        type: string
        required: true
      image:
        description: Local image name:tag inside the artifact.
        type: string
        required: true
      artifact-name:
        description: Artifact that holds image.tar.
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers / wait timers are configured on the Environment in GitHub.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    # Names follow the OpenTofu stack convention (<name>-<environment>).
    # Override any of them with an Environment variable of the same name.
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || format('p3-ecs-app-{0}', inputs.environment) }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || format('p3-ecs-app-{0}', inputs.environment) }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || format('p3-ecs-app-{0}', inputs.environment) }}
      TASK_DEFINITION_FAMILY: ${{ vars.TASK_DEFINITION_FAMILY || format('p3-ecs-app-{0}', inputs.environment) }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'app' }}
      APP_URL: ${{ vars.APP_URL }}
      LOCAL_IMAGE: ${{ inputs.image }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load -i "${{ runner.temp }}/image.tar"

      # Short-lived credentials from GitHub OIDC. No AWS keys are stored in GitHub.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-arn }}
          role-session-name: gha-p3-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tag = commit SHA. The repository is IMMUTABLE, so a re-run of the same
      # commit skips the push instead of overwriting the tag.
      - name: Push image to ECR
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Tag $GITHUB_SHA already in ECR, skipping push."
          else
            docker tag "$LOCAL_IMAGE" "$image_uri"
            docker push "$image_uri"
          fi
          echo "image=$image_uri" >> "$GITHUB_OUTPUT"

      # Start from the latest revision that OpenTofu registered (CPU, memory,
      # roles, logs, SSM secrets) and only swap the image.
      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition-family: ${{ env.TASK_DEFINITION_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.push.outputs.image }}

      # Registers the new revision, updates the service and waits until the ALB
      # reports healthy targets. The ECS circuit breaker rolls back on failure.
      - name: Deploy to ECS Fargate
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Smoke test
        if: env.APP_URL != ''
        run: |
          set -euo pipefail
          body=$(curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "${APP_URL}/health")
          echo "$body"
          echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\"" || {
            echo "::error::/health does not report version ${GITHUB_SHA}"; exit 1; }

      - name: Summary
        env:
          TASK_DEF_ARN: ${{ steps.deploy.outputs.task-definition-arn }}
          IMAGE_URI: ${{ steps.push.outputs.image }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          {
            echo "### Deployed to ${TARGET_ENV}"
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- Task definition: \`${TASK_DEF_ARN}\`"
            echo "- Service: \`${ECS_CLUSTER}/${ECS_SERVICE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
