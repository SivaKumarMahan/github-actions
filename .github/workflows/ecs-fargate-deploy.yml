# project3: build -> test -> Trivy scan -> push to ECR -> deploy to ECS Fargate.
#   staging    deploys automatically from main
#   production waits for an approval on the "production" GitHub Environment
#
# Safe without AWS: on pull requests, and while the AWS_DEPLOY_ROLE_ARN_* repository
# variables are empty, only the build, test and scan job runs.
name: ECS Fargate Deploy (project3)

on:
  push:
    branches: [main]
    paths:
      - 'project3-ecs-fargate-deploy/app/**'
      - '.github/workflows/ecs-fargate-deploy.yml'
      - '.github/workflows/ecs-fargate-deploy-env.yml'
  pull_request:
    paths:
      - 'project3-ecs-fargate-deploy/app/**'
      - '.github/workflows/ecs-fargate-deploy.yml'
      - '.github/workflows/ecs-fargate-deploy-env.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy half way; queue the next run instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: project3-ecs-fargate-deploy/app
  IMAGE: p3-ecs-app:${{ github.sha }}

jobs:
  build-scan:
    name: Build, test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      actions: read # needed by upload-sarif on private repositories
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once. The same image bytes are scanned, then pushed to every environment.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP_DIR }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=p3
          cache-to: type=gha,scope=p3,mode=max

      # Report every finding to the Security tab, without failing the job yet.
      - name: Trivy scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      # Fork PRs get a read-only token, so code scanning upload would fail there.
      - name: Upload SARIF to GitHub code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-project3

      # The gate: fail on HIGH or CRITICAL findings that have a fix available.
      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Save image for the deploy jobs
        if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN_STAGING != ''
        run: docker save "$IMAGE" -o "${{ runner.temp }}/image.tar"

      - name: Upload image artifact
        if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN_STAGING != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p3-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          STAGING_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN_STAGING }}
        run: |
          {
            echo "### project3 build"
            echo "- Image: \`$IMAGE\`"
            if [ -z "$STAGING_ROLE" ]; then
              echo "- Deploy skipped: repository variable \`AWS_DEPLOY_ROLE_ARN_STAGING\` is not set."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to staging
    needs: build-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN_STAGING != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ecs-fargate-deploy-env.yml
    with:
      environment: staging
      role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_STAGING }}
      image: p3-ecs-app:${{ github.sha }}
      artifact-name: p3-image

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    if: vars.AWS_DEPLOY_ROLE_ARN_PRODUCTION != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ecs-fargate-deploy-env.yml
    with:
      environment: production
      role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
      image: p3-ecs-app:${{ github.sha }}
      artifact-name: p3-image
