{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.serviceAccountName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and .Values.workloadIdentity.enabled .Values.workloadIdentity.clientId }}
    {{- if not .Values.serviceAccount.annotations }}
  annotations:
    {{- end }}
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
  {{- end }}
# The app does not call the Kubernetes API. Workload ID mounts its own projected token.
automountServiceAccountToken: false
{{- end }}
